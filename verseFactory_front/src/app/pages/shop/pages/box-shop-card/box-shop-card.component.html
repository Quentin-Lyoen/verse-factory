<div class="flex flex-col items-center gap-2">
    <img class="w-15 hover:cursor-pointer hover:scale-110 transition" [src]="`img/pets/${boxe()?.name}.png`" [alt]="boxe()?.name" (click)="openModal()">
    <h2 class="font-semibold">{{boxe()?.name}}</h2>
    <p>{{boxe()?.price}}$</p>
    <button (click)="buyBoxe()"
        class="px-3 py-1.5 rounded-lg border-2 border-(--bg-secondary) text-(--bg-secondary) text-sm font-semibold hover:bg-(--bg-secondary) hover:text-white transition cursor-pointer">Acheter</button>
</div>
