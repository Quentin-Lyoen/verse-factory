<div class="flex flex-col items-center gap-8">

    @if (errorMessage()) {
        <p class="text-md xl:text-2xl text-red-500 text-center">{{ errorMessage() }}</p>
    }

    <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-4 border-2 border-(--bg-secondary) rounded-xl p-4">
        @for (upgrade of upgrades(); track upgrade.upgradeId) {
            <app-upgrade-shop-card [upgrade]="upgrade" (errorMessage)="updateErrorMessage($event)" />
        }
    </div>

</div>
