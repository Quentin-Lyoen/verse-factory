<div class="flex flex-col items-center">
    <img class="w-15" [src]="`img/pets/${pet().name}.png`" [alt]="pet().name">
    <h2>{{ pet().name }}</h2>
    <p>{{ pet().incomePerSecond }}$</p>
    <button (click)="deletePetFromFactory()" class="px-3 py-1 mt-2 rounded-lg border-2 border-(--bg-secondary) text-(--bg-secondary) font-semibold hover:bg-(--bg-secondary) hover:text-white transition cursor-pointer">Retirer</button>
</div>
