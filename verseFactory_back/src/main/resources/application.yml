spring:
  application:
    name: template-spring-app-back
  datasource:
    # On utilise les noms de variables de Railway (PG...), avec tes valeurs locales par défaut
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:template_db}
    username: ${PGUSER:pgTemplate}
    password: ${PGPASSWORD:templatePwd}
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: versefactory
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8080/realms/versefactory}
          jwk-set-uri: ${OAUTH2_ISSUER_URI:http://localhost:8080/realms/versefactory}/protocol/openid-connect/certs

server:
  # Écoute sur le port imposé par Railway, ou 8081 en local
  port: ${PORT:8081}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

keycloak:
  admin:
    server-url: ${KEYCLOAK_URL:http://localhost:8080}
    realm: ${KEYCLOAK_REALM:versefactory}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    username: ${KEYCLOAK_ADMIN_USER:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:password}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://verse-factory.vercel.app}
