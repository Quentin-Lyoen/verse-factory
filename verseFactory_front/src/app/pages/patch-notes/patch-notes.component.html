<section
    class="min-h-[calc(100vh-4rem)] flex flex-col items-center bg-(--bg-primary) text-gray-900 pb-24 relative overflow-hidden">

    <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
        <div
            class="absolute top-[-10%] left-[-10%] w-[30rem] h-[30rem] rounded-full mix-blend-multiply filter blur-[80px] opacity-40 animate-pulse bg-(--bg-secondary) [animation-duration:4s]">
        </div>
        <div
            class="absolute bottom-[-10%] right-[-10%] w-[30rem] h-[30rem] bg-purple-300/60 rounded-full mix-blend-multiply filter blur-[80px] opacity-40 animate-pulse [animation-duration:5s] [animation-delay:1s]">
        </div>
    </div>

    <div class="max-w-4xl w-full mx-auto px-6 pt-16 pb-10 text-center z-10">

        <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-6 text-gray-900 leading-tight">
            Notes de <br class="sm:hidden" />
            <span
                class="text-transparent bg-clip-text bg-gradient-to-r from-(--bg-secondary) to-purple-500 drop-shadow-sm">Mise
                à jour</span>
        </h1>

        <p class="text-lg md:text-xl text-gray-600 mb-6 max-w-2xl mx-auto font-light leading-relaxed">
            Découvrez les dernières fonctionnalités, améliorations et corrections apportées à Verse Factory.
        </p>
    </div>

    <div class="max-w-4xl w-full mx-auto px-6 z-10 space-y-8">
        @for (note of patchNotes; track note.version; let first = $first) {
        <app-patch-note-card [note]="note" [first]="first" />
        }
    </div>

    <!-- Bottom Navigation Buttons -->
    <div class="max-w-4xl w-full mx-auto px-6 mt-12 text-center z-10">
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
            <a routerLink="/"
                class="px-8 py-4 rounded-2xl bg-white/80 backdrop-blur-sm text-gray-800 font-bold text-base border border-gray-200 shadow-sm hover:bg-gray-50 hover:border-gray-300 hover:-translate-y-1 transition-all duration-300 w-full sm:w-auto flex items-center justify-center gap-2 hover:cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" viewBox="0 0 20 20"
                    fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"
                        clip-rule="evenodd" />
                </svg>
                Retour à l'accueil
            </a>
            <a routerLink="/game"
                class="px-8 py-4 rounded-2xl text-white font-bold text-base shadow-xl shadow-purple-500/20 hover:shadow-2xl hover:shadow-purple-500/40 hover:-translate-y-1 transition-all duration-300 w-full sm:w-auto bg-(--bg-secondary) flex items-center justify-center gap-2 hover:cursor-pointer">
                Jouer maintenant
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white/90" viewBox="0 0 20 20"
                    fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"
                        clip-rule="evenodd" />
                </svg>
            </a>
        </div>
    </div>
</section>
