<style>
  :host {
    display: block;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
    color: #333;
  }
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 2rem;
    background-color: #1976d2;
    color: white;
  }
  .nav-links {
    display: flex;
    gap: 1rem;
  }
  a {
    color: white;
    text-decoration: none;
    font-weight: bold;
  }
  a:hover {
    text-decoration: underline;
  }
  button {
    background-color: white;
    color: #1976d2;
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
  }
  button:hover {
    background-color: #f0f0f0;
  }
  main {
    padding: 2rem;
  }
</style>

<nav>
  <div class="nav-links">
    <a routerLink="/">Accueil (Public)</a>
    <a routerLink="/game">Jeu (Privé)</a>
  </div>
  
  <div class="auth-section">
    @if (!isLoggedIn) {
      <button (click)="login()">Connexion (Keycloak)</button>
    } @else {
      <button (click)="logout()">Déconnexion</button>
    }
  </div>
</nav>

<main>
  <router-outlet></router-outlet>
</main>
