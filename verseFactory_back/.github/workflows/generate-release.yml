name: '🔖 Generate release'

# Ce workflow est désactivé par défaut pour éviter des déploiements accidentels après un fork.
# Pour l'activer, décommentez les triggers ci-dessous et configurez les variables.

on:
  workflow_dispatch:
#  pull_request:
#    types:
#      - closed

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  JAVA_VERSION: "21"
  REGISTRY: "harbor.e-mothep.com"

jobs:
  generate_release:
    name: '🔖 Generate release'
    if: github.event.pull_request.merged == true && contains(toJson(github.event.pull_request.labels.*.name), 'pending')
    runs-on: [self-hosted, linux, back]
    outputs:
      tag_version: ${{ steps.prepare_changelog.outputs.tag_version }}
    steps:
      - name: '⬇️ Checkout'
        uses: actions/checkout@v6
      - name: '🔊 Prepare changelog'
        uses: e-mothep/shared-workflow-docker/.github/common/release@main
        id: prepare_changelog
        with:
          release_system: release-please-action
          release_type: "maven"
          APP_ID: ${{ secrets.APP_ID }}
          APP_PEM: ${{ secrets.APP_PEM }}
          BRANCH: ${{ github.ref_name }}


  install_dependencies:
    name: '⚙️ Install dependencies'
    runs-on: [self-hosted, linux, back]
    needs: [generate_release]
    steps:
      - name: '⬇️ Checkout'
        uses: actions/checkout@v6
      - name: 'Check cache dependencies'
        uses: actions/cache@v5
        id: cached
        with:
          path: ~/.m2
          key: ${{ runner }}-dependencies-${{ hashFiles('**/pom.xml') }}
          lookup-only: true
      - name: '⚙️ Install dependencies'
        if: steps.cached.outputs.cache-hit != true
        uses: e-mothep/shared-workflow-docker/.github/java/dependencies@main
        with:
          java-version: ${{ env.JAVA_VERSION }}

  build_application:
    name: '🏗️ Build application'
    runs-on: [self-hosted, linux, back]
    needs: [install_dependencies]
    steps:
      - name: '⬇️ Checkout'
        uses: actions/checkout@v6
      - name: 'Check cache dependencies'
        uses: actions/cache@v5
        id: cached
        with:
          path: ~/.m2
          key: ${{ runner }}-dependencies-${{ hashFiles('**/pom.xml') }}
      - name: '🏗️ Build application'
        uses: e-mothep/shared-workflow-docker/.github/java/build@main
      - name: 'Upload build'
        uses: actions/cache/save@v4
        with:
          key: ${{ runner.os }}-build-${{ github.run_id }}
          path: target

  test_application:
    name: '🧪 Test application 🔎'
    runs-on: ubuntu-latest
    needs: [install_dependencies]
    steps:
      - name: '⚙️ Setup JAVA'
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "zulu"
      - name: '⬇️ Checkout'
        uses: actions/checkout@v6
      - name: 'Check cache dependencies'
        uses: actions/cache@v5
        id: cached
        with:
          path: ~/.m2
          key: ${{ runner }}-dependencies-${{ hashFiles('**/pom.xml') }}
      - name: '🧪 Test application'
        uses: e-mothep/shared-workflow-docker/.github/java/test@main
        with:
          java_version: ${{ env.JAVA_VERSION }}

  finalize_release:
    name: '🔖 Finalize release'
    runs-on: [self-hosted, linux, back]
    needs: [build_application, generate_release, test_application]
    env:
      source: target
      target: ${{ github.event.repository.name }}.tar.xz
    steps:
      - name: 'Download build'
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-build-${{ github.run_id }}
          path: target
      - name: '🎒 Create archive'
        run: tar cJvf ${{ env.target }} -C ${{ env.source }} .
      - name: '🔖 Finalize release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ needs.generate_release.outputs.tag_version }} ${{ env.target }}

  upload_release:
    name: '📩 Upload release'
    runs-on: [self-hosted, linux, back]
    needs: [finalize_release, generate_release]
    env:
      registry: harbor.e-mothep.com
    steps:
      - name: 'Download build'
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-build-${{ github.run_id }}
          path: target
      - name: '🐋 Build and push to registry'
        uses: e-mothep/shared-workflow-docker/.github/java/build-docker@main
        with:
          DOCKER_REGISTRY: ${{ env.registry }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          APP_IMAGE_REPOSITORY: CHANGE_ME # Exemple: luna, qualiopsys, etc.
          APP_NAME: ${{ github.event.repository.name }}
          TAG_VERSION: ${{ needs.generate_release.outputs.tag_version }}
